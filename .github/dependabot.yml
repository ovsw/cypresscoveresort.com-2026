version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # ESLint 10 breaks `pnpm lint`: eslint-config-next loads
      # eslint-plugin-react, which still calls context.getFilename (removed in
      # ESLint 10). Drop this rule once eslint-plugin-react supports ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
